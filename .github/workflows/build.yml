name: ci-build
'on':
  push:
    paths:
      # Rust源代码
      - 'src/**'
      # Cargo配置文件
      - 'Cargo.toml'
      - 'Cargo.lock'
      # Git子模块配置
      - '.gitmodules'
      - 'module'
      # 工作流文件本身
      - '.github/workflows/build.yml'
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup ndk
        run: |
          # 固定 NDK 版本，不用 latest：latest 是浮动依赖（NDK r30 于 2026-09-08 发布后，
          # 其 sysroot/libc++ 头与 runner 的 libclang 组合会破坏 bindgen 的内置头解析）
          wget -O ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip -nv
          mkdir -p ~/ndk_temp
          unzip ndk.zip -d ~/ndk_temp 2>&1 > /dev/null
          mv ~/ndk_temp/*/* ~/ndk_temp
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        id: cache-cargo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Setup Rust toolchains
        run: |
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib libclang-dev
      - name: Build
        run: |
          export ANDROID_NDK_HOME=~/ndk_temp
          export ANDROID_NDK_ROOT=~/ndk_temp
          NDK_PREBUILT=~/ndk_temp/toolchains/llvm/prebuilt/linux-x86_64
          # 与本地 build.py 相同的构建方式，不经过 cargo-ndk：
          # cargo-ndk 会注入 --sysroot 并覆盖 BINDGEN_EXTRA_CLANG_ARGS，
          # 与 runner 的 libclang 组合会让 bindgen 找不到内置头（stdbool.h 等），
          # 导致 binder_ndk_sys 的 build.rs panic（exit 101）
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_PREBUILT/bin/aarch64-linux-android33-clang
          # libclang 必须使用"库与内置头目录相邻"的安装（llvm-* 目录布局），
          # 否则 bindgen 解析头文件时报 stdbool.h/stddef.h not found
          LIBCLANG_SO=$(find /usr/lib -maxdepth 4 -name 'libclang.so*' -path '*llvm*' 2>/dev/null | head -n1)
          [ -z "$LIBCLANG_SO" ] && LIBCLANG_SO=$(find /usr/lib -maxdepth 4 -name 'libclang.so*' 2>/dev/null | head -n1)
          export LIBCLANG_PATH=$(dirname "$LIBCLANG_SO")
          # target 必须带 API 版本号（r30 起未版本化 triple 会在 sys/cdefs.h 直接报错），
          # 并补齐 per-triple 头目录（asm/types.h 等）
          export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-linux-android33 -I$NDK_PREBUILT/sysroot/usr/include -I$NDK_PREBUILT/sysroot/usr/include/aarch64-linux-android -isystem $(echo $NDK_PREBUILT/lib/clang/*/include)"
          # 构建发布版本
          cargo build --release --target aarch64-linux-android
          # 准备模块包
          cp target/aarch64-linux-android/release/gpugovernor module/bin/
          rm -rf module/.git
          # 创建临时目录用于打包
          mkdir -p temp_package
          # 复制指定的文件夹
          cp -r module/bin temp_package/
          cp -r module/config temp_package/
          cp -r module/docs temp_package/
          cp -r module/META-INF temp_package/
          cp -r module/script temp_package/
          cp -r module/webroot temp_package/
          # 复制指定的文件
          cp module/action.sh temp_package/
          cp module/customize.sh temp_package/

          cp module/module.prop temp_package/
          cp module/service.sh temp_package/
          cp module/uninstall.sh temp_package/
          cp module/volt_list.txt temp_package/
          # 创建 zip 文件
          cd temp_package/
          zip -r ../Mediatek_Mali_GPU_Governor.zip .
      - name: Prepare Upload Info
        id: prep
        run: |
          echo "CARGO_VERSION=$(grep '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
      - name: Upload
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARGO_VERSION: ${{ env.CARGO_VERSION }}
          COMMIT_MESSAGE: |+
            🚀 **Mediatek Mali GPU Governor Build \#${{ github.run_number }}**
            📋 **Build Info:**
            Version: `v${{ env.CARGO_VERSION }}`
            [Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            📝 **Commit Message:**
            ```
            ${{ format('{0}', github.event.head_commit.message) }}
            ```
            by `${{ github.event.head_commit.author.name }}`
            
            🔗 [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_MESSAGE=$(echo "${COMMIT_MESSAGE}" | jq -R -s '.')
          
          curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup" \
               -F "chat_id=${CHAT_ID}" \
               -F "message_thread_id=15" \
               -F "media=[{\"type\":\"document\",\"media\":\"attach://file\",\"parse_mode\":\"MarkdownV2\",\"caption\":${ESCAPED_MESSAGE}}]" \
               -F "file=@Mediatek_Mali_GPU_Governor.zip"
